# Local forward proxy so the Go binaries (prometheus, alertmanager, blackbox) can reach hostnames:
# Go's resolver wants /etc/resolv.conf, Android has none. tinyproxy is bionic, resolves like curl does.
Port 8118
Listen 127.0.0.1
Allow 127.0.0.1
Timeout 30
MaxClients 20
LogLevel Warning
ConnectPort 443
ConnectPort 8443
