groups:
  - name: fleet
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels: { severity: none }
        annotations: { summary: "monitor alive (dead man's switch, always firing)" }

      - alert: TargetDown
        expr: up == 0
        for: 3m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.job }} {{ $labels.instance }} not scrapable" }

      - alert: ProbeFailed
        expr: probe_success == 0
        for: 3m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.site }}{{ $labels.instance }} probe failed" }

      - alert: CertExpiresSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.site }} cert expires in {{ $value | printf \"%.0f\" }} days" }

      - alert: DiskAlmostFull
        expr: node_filesystem_avail_bytes{mountpoint="/data"} / node_filesystem_size_bytes < 0.10
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.host }} /data below 10% free" }

      - alert: HotPhone
        expr: max by (host) (termux_cpu_temperature_celsius) > 75
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.host }} {{ $value }}°C for 10m" }

      - alert: SwapHeavy
        expr: (1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes) > 0.8
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.host }} swap > 80% (OS kill risk)" }

      - alert: BatteryDraining
        expr: termux_battery_plugged == 1 and termux_battery_current_amps > 0
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.host }} plugged in but draining {{ $value }} A (cable/port/handshake)" }

      - alert: BatteryUnplugged
        expr: termux_battery_plugged == 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.host }} on battery" }

      - alert: BatteryLow
        expr: termux_battery_percent < 20
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.host }} battery {{ $value }}%" }

      - alert: BatteryStale
        expr: time() - node_textfile_mtime_seconds{file="termux.prom"} > 300
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.host }} termux.prom not updated (crond?)" }

      - alert: HighLoad
        expr: termux_load15 > 6
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.host }} load15 {{ $value }} for 30m" }

      # cpu busy per core = 1 - rate(idle); "1 - rate(termux_cpu_idle_seconds_total[5m])" in grafana
      - alert: CpuPegged
        expr: avg by (host) (1 - rate(termux_cpu_idle_seconds_total[10m])) > 0.9
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "{{ $labels.host }} cpu > 90% for 30m" }
