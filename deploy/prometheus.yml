global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files: [alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ['127.0.0.1:9093'] }]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ['127.0.0.1:9090'] }]

  - job_name: haproxy
    static_configs: [{ targets: ['127.0.0.1:9101'] }]

  - job_name: anubis
    static_configs:
      - targets: ['127.0.0.1:9917']
        labels: { app: mealprep }
      - targets: ['127.0.0.1:9091']
        labels: { app: shoko }

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels: { host: poco }

  # blackbox: probes go through the real ports (haproxy, anubis, dns) even though it is the same box
  # "name" is what dashboards and alerts show
  - job_name: http
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - { targets: ['http://192.168.1.106:8111/api/v3/Init/Status'], labels: { name: 'shoko api' } }
      - { targets: ['http://192.168.1.106:8090/'], labels: { name: 'mealprep app' } }
    relabel_configs: &bb
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: 127.0.0.1:9115 }

  # public sites by name through haproxy + anubis (dns via tinyproxy, see blackbox.yml)
  - job_name: public
    metrics_path: /probe
    params: { module: [http_public] }
    static_configs:
      - { targets: ['https://poco.xn--bdk.dog:8443/'], labels: { name: 'mealprep public' } }
      - { targets: ['https://shoko.poco.xn--bdk.dog:8443/'], labels: { name: 'shoko public' } }
      - { targets: ['https://grafana.poco.xn--bdk.dog:8443/login'], labels: { name: 'grafana public' } }
    relabel_configs: *bb

  - job_name: tcp
    metrics_path: /probe
    params: { module: [tcp_connect] }
    static_configs:
      - { targets: ['192.168.1.106:8022'], labels: { name: 'sshd' } }
      - { targets: ['192.168.1.106:2049'], labels: { name: 'nfs' } }
    relabel_configs: *bb
