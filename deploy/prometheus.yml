global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files: [alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ['127.0.0.1:9093'] }]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ['127.0.0.1:9090'] }]

  - job_name: anubis
    static_configs:
      - targets: ['127.0.0.1:9917']
        labels: { app: mealprep }
      - targets: ['127.0.0.1:9091']
        labels: { app: shoko }

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels: { host: poco }

  # blackbox: probes go through the real ports (haproxy, anubis, dns) even though it is the same box
  - job_name: http
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets:
          - http://192.168.1.106:8111/api/v3/Init/Status   # shoko api, lan
          - http://192.168.1.106:8090/                # mealprep app, lan
    relabel_configs: &bb
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: 127.0.0.1:9115 }

  # public sites by name through haproxy + anubis (dns via tinyproxy, see blackbox.yml)
  - job_name: public
    metrics_path: /probe
    params: { module: [http_public] }
    static_configs:
      - targets:
          - https://poco.xn--bdk.dog:8443/
          - https://shoko.poco.xn--bdk.dog:8443/
    relabel_configs: *bb

  - job_name: tcp
    metrics_path: /probe
    params: { module: [tcp_connect] }
    static_configs:
      - targets:
          - 192.168.1.106:8022    # poco sshd
          - 192.168.1.106:2049    # poco nfs export
    relabel_configs: *bb
