# prom./alerts./grafana.poco.xn--bdk.dog. Symlinked into ~/haproxy.d/, backend picked by Host label.
# prom + alerts: basic auth done by prometheus/alertmanager themselves (--web.config.file ~/monitoring/web.yml, bcrypt).
# termux haproxy has no crypt(3), a userlist here would have to be plaintext.
backend prom
    server prometheus 127.0.0.1:9090 check

backend alerts
    server alertmanager 127.0.0.1:9093 check

backend grafana
    server grafana 127.0.0.1:3000 check
