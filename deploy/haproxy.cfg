# prom./alerts./grafana.poco.xn--bdk.dog. Symlinked into ~/haproxy.d/, backend picked by Host label.
# prom + alerts: no login of their own -> haproxy basic auth (sha512crypt hash, 24 random chars). grafana: own login.
userlist monitoring
    user mrk password $6$cM8PUVwi/wtG5ZH8$2kUBIMyAw9hdcZ0EBK/DDs6aGP9cSv8lAstZBmxkSLIGD65hR6r.k9TaTzeAiO/32TAkughAHvuAy5n5KOhn6.

backend prom
    http-request auth realm prometheus unless { http_auth(monitoring) }
    server prometheus 127.0.0.1:9090 check

backend alerts
    http-request auth realm alertmanager unless { http_auth(monitoring) }
    server alertmanager 127.0.0.1:9093 check

backend grafana
    server grafana 127.0.0.1:3000 check
