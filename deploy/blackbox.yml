modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      follow_redirects: true
      preferred_ip_protocol: ip4
  # pure-Go resolver finds no /etc/resolv.conf on Android -> names only through the local tinyproxy (bionic dns).
  # public sites: real dns + nat loopback + cert + haproxy + anubis, the whole chain.
  http_public:
    prober: http
    timeout: 15s
    http:
      follow_redirects: true
      proxy_url: http://127.0.0.1:8118
      skip_resolve_phase_with_proxy: true
  tcp_connect:
    prober: tcp
    timeout: 5s
